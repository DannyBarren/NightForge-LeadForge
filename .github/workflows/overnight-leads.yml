# Overnight LeadForge — paid pipeline, manual only.
#
# Why this file used to fail on every push (15 red runs, 0s, 0 jobs):
# GitHub validates every workflow file on push. The previous version used
#
#     if: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON != '' }}
#
# GitHub rejects `secrets` in `if:` as "Unrecognized named-value: 'secrets'".
# That is a parse failure, not a pipeline failure. The run was recorded as
# event=push even though the only configured trigger is workflow_dispatch, and
# no job ever started. The nightly schedule was already commented out; it was
# not the cause. Confirmed on run 35675540163
# (https://github.com/DannyBarren/NightForge-LeadForge/actions/runs/35675540163).
#
# Rules now:
# - Trigger is workflow_dispatch only. No push. No schedule.
# - `secrets` is never used in an `if:` expression.
# - If OPENAI_API_KEY is unset, the job succeeds and skips the spend path.
#   A missing secret is not a red X.
# - Uncomment the schedule block only after adding OPENAI_API_KEY (and
#   optionally TAVILY_API_KEY) as repository secrets. Every enabled run
#   spends real money against those secrets.
name: Overnight LeadForge

on:
  workflow_dispatch:
    inputs:
      location:
        description: "Target location (e.g. Phoenix AZ)"
        required: false
        default: "Phoenix AZ"
      max_leads:
        description: "Max leads to process"
        required: false
        default: "30"
      zip_code:
        description: "Required zip code for local leads"
        required: false
        default: "85001"
      sample_mode:
        description: "Run sample mode (3 leads only)"
        required: false
        type: boolean
        default: false

# schedule:  # enable only with secrets configured; this spends money
#   - cron: "0 2 * * *"

permissions:
  contents: read

env:
  LEADFORGE_LLM_PROVIDER: openai
  LEADFORGE_MODEL: gpt-4o-mini
  LEADFORGE_BUDGET_USD: "8.0"
  LEADFORGE_STOP_PROJECTED_USD: "7.25"
  LEADFORGE_PARALLEL_RESEARCH: "6"

jobs:
  leadforge:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Gate paid work on the presence of an API key
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY is not configured. Skipping the overnight pipeline so this job stays green. Add the secret and re-run via workflow_dispatch when you intend to spend."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.has_key == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.has_key == 'true'
        run: pip install -r requirements.txt

      - name: Apply repository variables
        if: steps.gate.outputs.has_key == 'true'
        run: |
          if [ -n "${{ vars.LEADFORGE_LLM_PROVIDER }}" ]; then
            echo "LEADFORGE_LLM_PROVIDER=${{ vars.LEADFORGE_LLM_PROVIDER }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.LEADFORGE_MODEL }}" ]; then
            echo "LEADFORGE_MODEL=${{ vars.LEADFORGE_MODEL }}" >> "$GITHUB_ENV"
          fi

      - name: Write Google service account (optional)
        if: steps.gate.outputs.has_key == 'true'
        env:
          GCP_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GCP_CREDS" ]; then
            echo "No Google Sheets credentials; Sheets export disabled."
            exit 0
          fi
          mkdir -p credentials
          printf '%s' "$GCP_CREDS" > credentials/google-service-account.json
          echo "GOOGLE_SHEETS_CREDENTIALS_JSON=${{ github.workspace }}/credentials/google-service-account.json" >> "$GITHUB_ENV"

      - name: Preflight / dry-run
        if: steps.gate.outputs.has_key == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          LEADFORGE_TARGET_ZIP: ${{ github.event.inputs.zip_code || '85001' }}
          LEADFORGE_TARGET_LOCATION: ${{ github.event.inputs.location || 'Phoenix AZ' }}
          LEADFORGE_MAX_LEADS: ${{ github.event.inputs.max_leads || '30' }}
        run: python scripts/run_overnight.py --dry-run

      - name: Run overnight pipeline
        if: steps.gate.outputs.has_key == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WORKSHEET: LeadForge Output
          LEADFORGE_TARGET_ZIP: ${{ github.event.inputs.zip_code || '85001' }}
          LEADFORGE_TARGET_LOCATION: ${{ github.event.inputs.location || 'Phoenix AZ' }}
          LEADFORGE_MAX_LEADS: ${{ github.event.inputs.max_leads || '30' }}
        run: |
          if [ "${{ github.event.inputs.sample_mode }}" = "true" ]; then
            python scripts/run_overnight.py --sample
          else
            python scripts/run_overnight.py
          fi

      - name: Upload artifacts
        if: always() && steps.gate.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: leadforge-output-${{ github.run_id }}
          path: |
            data/output/leads_*.csv
            data/output/leads_*.json
            data/output/manifest_*.json
            data/output/token_usage_*.json
          if-no-files-found: warn
          retention-days: 30
