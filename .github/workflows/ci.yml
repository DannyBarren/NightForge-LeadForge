name: CI

on:
  push:
    branches: [main, production/langgraph]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest tests/ -q
      - name: Offline eval harness
        run: python -m evals.harness
      - name: Prototype dry-run (no spend)
        run: python scripts/run_overnight.py --dry-run
        env:
          OPENAI_API_KEY: ci-placeholder
      - name: NightForge dry-run (no spend)
        run: python -m nightforge.cli research --dry-run --quiet
        env:
          OPENAI_API_KEY: ci-placeholder
